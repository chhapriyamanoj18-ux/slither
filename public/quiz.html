<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Kids - Fun MCQ Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #7ee8fa;
      --bg-2: #eec0c6;
      --card: #ffffff;
      --ink: #3a2e5c;
      --purple: #7c4dff;
      --pink: #ff5c8a;
      --yellow: #ffcb2b;
      --green: #2fd07a;
      --red: #ff5b5b;
      --blue: #38b6ff;
      --shadow: rgba(58, 46, 92, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Baloo 2', system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #a18cd1 0%, #7ee8fa 50%, #fbc2eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* floating background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .blob.b1 { width: 120px; height: 120px; background: #ffcb2b; top: 8%; left: 6%; animation-delay: 0s; }
    .blob.b2 { width: 90px; height: 90px; background: #ff5c8a; bottom: 12%; left: 10%; animation-delay: 1.5s; }
    .blob.b3 { width: 140px; height: 140px; background: #38b6ff; top: 14%; right: 8%; animation-delay: 0.8s; }
    .blob.b4 { width: 80px; height: 80px; background: #2fd07a; bottom: 10%; right: 12%; animation-delay: 2.2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.08); }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 32px;
      padding: 22px 22px 26px;
      box-shadow: 0 18px 40px var(--shadow);
      border: 5px solid #fff;
      outline: 4px solid rgba(124, 77, 255, 0.15);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--purple);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-pill {
      background: var(--yellow);
      color: #6b4b00;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.95rem;
      box-shadow: 0 4px 0 #e0a800;
    }

    /* progress dots */
    .progress {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .dot {
      width: 26px;
      height: 10px;
      border-radius: 999px;
      background: #e6e0f5;
      transition: background 0.3s, transform 0.3s;
    }
    .dot.done { background: var(--green); }
    .dot.current { background: var(--purple); transform: scaleX(1.25); }

    .q-number {
      text-align: center;
      font-weight: 700;
      color: var(--pink);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .question {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      text-wrap: balance;
    }

    .img-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .img-wrap img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      background: #f3f0fb;
      border-radius: 24px;
      padding: 10px;
      border: 4px dashed #d9cff2;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option {
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      background: #f6f3ff;
      border: 3px solid #e3dbf7;
      border-radius: 18px;
      padding: 16px 10px;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s, border-color 0.2s;
      box-shadow: 0 4px 0 #e3dbf7;
    }
    .option:hover:not(:disabled) { transform: translateY(-2px); background: #efe8ff; }
    .option:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
    .option:disabled { cursor: not-allowed; }

    .option.correct {
      background: var(--green);
      border-color: #26b063;
      box-shadow: 0 4px 0 #26b063;
      color: #fff;
      animation: bounce 0.5s;
    }
    .option.wrong {
      background: var(--red);
      border-color: #e04444;
      box-shadow: 0 4px 0 #e04444;
      color: #fff;
      animation: shake 0.4s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-10px); }
      60% { transform: translateY(-4px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .nav {
      display: flex;
      gap: 12px;
    }
    .nav button {
      flex: 1;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.12s, filter 0.2s;
    }
    #prevBtn { background: var(--blue); box-shadow: 0 5px 0 #2b8fcc; }
    #nextBtn { background: var(--pink); box-shadow: 0 5px 0 #d63c69; }
    .nav button:hover:not(:disabled) { transform: translateY(-2px); }
    .nav button:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    .nav button:disabled {
      background: #d8d2e6;
      box-shadow: 0 5px 0 #c4bcd8;
      cursor: not-allowed;
      color: #fff;
      opacity: 0.8;
    }

    .hint {
      text-align: center;
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #8a7fb0;
      min-height: 20px;
    }

    /* Emoji feedback popup */
    .emoji-pop {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 8rem;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
    }
    .emoji-pop.show {
      animation: emojiPop 1.1s ease forwards;
    }
    @keyframes emojiPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.3) rotate(8deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      80% { transform: translate(-50%, -55%) scale(1) rotate(0); opacity: 1; }
      100% { transform: translate(-50%, -75%) scale(0.8) rotate(0); opacity: 0; }
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* Final popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(58, 46, 92, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }
    .overlay.show { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .final {
      background: #fff;
      border-radius: 32px;
      padding: 32px 26px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      border: 6px solid var(--yellow);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: popIn 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .final .big-emoji {
      font-size: 5rem;
      animation: spinPop 1s ease;
    }
    @keyframes spinPop {
      0% { transform: scale(0) rotate(-180deg); }
      100% { transform: scale(1) rotate(0); }
    }
    .final h2 {
      color: var(--purple);
      font-size: 2rem;
      margin: 8px 0;
    }
    .final p {
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .final .final-score {
      color: var(--pink);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 18px;
    }
    .play-again {
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 999px;
      padding: 16px 32px;
      cursor: pointer;
      box-shadow: 0 8px 0 #5a35c4;
      animation: wiggle 1.6s ease-in-out infinite;
    }
    .play-again:hover { filter: brightness(1.08); }
    .play-again:active { transform: translateY(4px); box-shadow: 0 4px 0 #5a35c4; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.05); }
    }

    @media (max-width: 420px) {
      .options { grid-template-columns: 1fr; }
      .question { font-size: 1.15rem; }
      .title { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <canvas id="confetti"></canvas>
  <div class="emoji-pop" id="emojiPop" aria-hidden="true"></div>

  <main class="card" role="main">
    <header>
      <div class="title">🎈 Quiz Kids</div>
      <div class="score-pill">⭐ <span id="score">0</span></div>
    </header>

    <div class="progress" id="progress" aria-hidden="true"></div>

    <div class="q-number" id="qNumber">Question 1 of 5</div>
    <h1 class="question" id="question">Loading...</h1>

    <div class="img-wrap">
      <img id="qImage" src="" alt="Question picture" />
    </div>

    <div class="options" id="options"></div>

    <div class="nav">
      <button id="prevBtn" type="button">⬅ Prev</button>
      <button id="nextBtn" type="button">Next ➡</button>
    </div>

    <p class="hint" id="hint">Pick the right answer to unlock Next!</p>
  </main>

  <!-- Final popup -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="finalTitle">
    <div class="final">
      <div class="big-emoji" id="finalEmoji">🏆</div>
      <h2 id="finalTitle">You Did It!</h2>
      <p>Great job, superstar!</p>
      <div class="final-score" id="finalScore">Score: 0 / 5</div>
      <button class="play-again" id="playAgain" type="button">🔄 Play Again</button>
    </div>
  </div>

  <script>
    // ---------- Questions data ----------
    const QUESTIONS = [
      {
        question: "Which animal is this?",
        image: "/images/cat.png",
        options: ["Dog", "Cat", "Rabbit", "Bird"],
        answer: 1,
      },
      {
        question: "How many apples do you see?",
        image: "/images/apples.png",
        options: ["2", "3", "4", "5"],
        answer: 1,
      },
      {
        question: "What color is the banana?",
        image: "/images/banana.png",
        options: ["Red", "Green", "Yellow", "Blue"],
        answer: 2,
      },
      {
        question: "What shape is this?",
        image: "/images/star.png",
        options: ["Square", "Star", "Circle", "Heart"],
        answer: 1,
      },
      {
        question: "Which animal says 'Moo'?",
        image: "/images/cow.png",
        options: ["Duck", "Dog", "Cow", "Cat"],
        answer: 2,
      },
    ];

    // ---------- State ----------
    let current = 0;
    let score = 0;
    const solved = new Array(QUESTIONS.length).fill(false); // correctly answered

    // ---------- Elements ----------
    const $ = (id) => document.getElementById(id);
    const questionEl = $("question");
    const qNumberEl = $("qNumber");
    const qImageEl = $("qImage");
    const optionsEl = $("options");
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const scoreEl = $("score");
    const hintEl = $("hint");
    const progressEl = $("progress");
    const emojiPop = $("emojiPop");
    const overlay = $("overlay");

    // ---------- Build progress dots ----------
    QUESTIONS.forEach((_, i) => {
      const d = document.createElement("span");
      d.className = "dot";
      progressEl.appendChild(d);
    });

    function updateProgress() {
      [...progressEl.children].forEach((dot, i) => {
        dot.classList.toggle("done", solved[i]);
        dot.classList.toggle("current", i === current);
      });
    }

    // ---------- Sound (Web Audio API, no files needed) ----------
    let audioCtx;
    function beep(type) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (type === "correct") {
          playTone(523.25, 0, 0.12); // C5
          playTone(659.25, 0.12, 0.12); // E5
          playTone(783.99, 0.24, 0.2); // G5
        } else {
          playTone(196, 0, 0.18, "sawtooth"); // low buzz
          playTone(155, 0.18, 0.22, "sawtooth");
        }
      } catch (e) { /* audio not available */ }
    }
    function playTone(freq, delay, dur, wave) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = wave || "triangle";
      osc.frequency.value = freq;
      const start = audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }

    // ---------- Emoji popup ----------
    function showEmoji(emoji) {
      emojiPop.textContent = emoji;
      emojiPop.classList.remove("show");
      void emojiPop.offsetWidth; // restart animation
      emojiPop.classList.add("show");
    }

    // ---------- Confetti ----------
    const canvas = $("confetti");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let confettiRAF = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const COLORS = ["#ff5c8a", "#ffcb2b", "#2fd07a", "#38b6ff", "#7c4dff", "#ff8a3d"];

    function launchConfetti(amount = 120) {
      for (let i = 0; i < amount; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.3,
          w: 8 + Math.random() * 8,
          h: 10 + Math.random() * 10,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          vx: (Math.random() - 0.5) * 3,
          vy: 3 + Math.random() * 4,
        });
      }
      if (!confettiRAF) confettiRAF = requestAnimationFrame(renderConfetti);
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vy += 0.05;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      confettiPieces = confettiPieces.filter((p) => p.y < canvas.height + 40);
      if (confettiPieces.length > 0) {
        confettiRAF = requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiRAF = null;
      }
    }

    // ---------- Render a question ----------
    function render() {
      const q = QUESTIONS[current];
      questionEl.textContent = q.question;
      qNumberEl.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      qImageEl.src = q.image;
      qImageEl.alt = q.question;
      // restart image pop animation
      qImageEl.style.animation = "none";
      void qImageEl.offsetWidth;
      qImageEl.style.animation = "";

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.type = "button";
        btn.textContent = opt;
        // if already solved, lock in the correct highlight
        if (solved[current]) {
          btn.disabled = true;
          if (i === q.answer) btn.classList.add("correct");
        }
        btn.addEventListener("click", () => handleAnswer(i, btn));
        optionsEl.appendChild(btn);
      });

      // nav buttons
      prevBtn.disabled = current === 0;
      nextBtn.disabled = !solved[current];
      nextBtn.textContent = current === QUESTIONS.length - 1 ? "Finish 🎉" : "Next ➡";

      hintEl.textContent = solved[current]
        ? "Nice! You can go Next 👉"
        : "Pick the right answer to unlock Next!";

      updateProgress();
    }

    // ---------- Answer handling ----------
    function handleAnswer(index, btn) {
      if (solved[current]) return; // already answered correctly, locked
      const q = QUESTIONS[current];

      if (index === q.answer) {
        // Correct!
        solved[current] = true;
        score += 1;
        scoreEl.textContent = score;
        btn.classList.add("correct");
        [...optionsEl.children].forEach((b) => (b.disabled = true));
        showEmoji("😄");
        beep("correct");
        launchConfetti(130);
        nextBtn.disabled = false;
        hintEl.textContent = "Awesome! 🎉";
        updateProgress();

        // If last question, auto-open final popup
        if (current === QUESTIONS.length - 1) {
          setTimeout(showFinal, 1200);
        }
      } else {
        // Wrong - let them try again
        btn.classList.add("wrong");
        showEmoji("😢");
        beep("wrong");
        hintEl.textContent = "Oops! Try again 💪";
        // remove wrong style after animation so they can retry
        setTimeout(() => btn.classList.remove("wrong"), 700);
      }
    }

    // ---------- Final popup ----------
    function showFinal() {
      $("finalScore").textContent = `Score: ${score} / ${QUESTIONS.length}`;
      const perfect = score === QUESTIONS.length;
      $("finalEmoji").textContent = perfect ? "🏆" : "🌟";
      $("finalTitle").textContent = perfect ? "Perfect Score!" : "Well Done!";
      overlay.classList.add("show");
      launchConfetti(200);
      beep("correct");
    }

    // ---------- Navigation ----------
    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current -= 1;
        render();
      }
    });
    nextBtn.addEventListener("click", () => {
      if (!solved[current]) return;
      if (current < QUESTIONS.length - 1) {
        current += 1;
        render();
      } else {
        showFinal();
      }
    });

    // ---------- Play again ----------
    $("playAgain").addEventListener("click", () => {
      current = 0;
      score = 0;
      scoreEl.textContent = "0";
      solved.fill(false);
      overlay.classList.remove("show");
      render();
    });

    // ---------- Start ----------
    render();
  </script>
</body>
</html>
