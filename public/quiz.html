<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Kids - Fun MCQ Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card: #ffffff;
      --ink: #3a2e5c;
      --purple: #7c4dff;
      --pink: #ff5c8a;
      --yellow: #ffcb2b;
      --green: #2fd07a;
      --red: #ff5b5b;
      --blue: #38b6ff;
      --shadow: rgba(58, 46, 92, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    html { background: #8a7ce0; }

    body {
      font-family: 'Baloo 2', system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #a18cd1 0%, #7ee8fa 40%, #fbc2eb 75%, #ffd194 100%);
      background-size: 300% 300%;
      animation: bgShift 16s ease infinite;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* floating background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.5;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .blob.b1 { width: 120px; height: 120px; background: radial-gradient(circle at 30% 30%, #ffe27a, #ffcb2b); top: 8%; left: 6%; animation-delay: 0s; }
    .blob.b2 { width: 90px; height: 90px; background: radial-gradient(circle at 30% 30%, #ff9dbb, #ff5c8a); bottom: 12%; left: 10%; animation-delay: 1.5s; }
    .blob.b3 { width: 140px; height: 140px; background: radial-gradient(circle at 30% 30%, #8fd6ff, #38b6ff); top: 14%; right: 8%; animation-delay: 0.8s; }
    .blob.b4 { width: 80px; height: 80px; background: radial-gradient(circle at 30% 30%, #85e6b4, #2fd07a); bottom: 10%; right: 12%; animation-delay: 2.2s; }
    .blob.b5 { width: 60px; height: 60px; background: radial-gradient(circle at 30% 30%, #c6b4ff, #7c4dff); top: 45%; left: 4%; animation-delay: 3s; }
    .blob.b6 { width: 70px; height: 70px; background: radial-gradient(circle at 30% 30%, #ffd194, #ff9d5c); top: 50%; right: 5%; animation-delay: 1s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.08); }
    }

    /* twinkling stars */
    .twinkle {
      position: fixed;
      z-index: 0;
      font-size: 22px;
      opacity: 0.85;
      animation: twinkle 2.6s ease-in-out infinite;
      user-select: none;
    }
    .twinkle.t1 { top: 18%; left: 22%; animation-delay: 0.2s; }
    .twinkle.t2 { top: 30%; right: 20%; animation-delay: 0.9s; font-size: 16px; }
    .twinkle.t3 { bottom: 22%; left: 26%; animation-delay: 1.4s; font-size: 18px; }
    .twinkle.t4 { bottom: 30%; right: 24%; animation-delay: 0.5s; }
    .twinkle.t5 { top: 12%; left: 48%; animation-delay: 1.9s; font-size: 14px; }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.35; }
      50% { transform: scale(1.15) rotate(18deg); opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      background: linear-gradient(180deg, #ffffff 0%, #fdfbff 100%);
      border-radius: 34px;
      padding: 24px 24px 28px;
      box-shadow: 0 24px 50px var(--shadow), 0 4px 0 rgba(124,77,255,0.08);
      border: 5px solid #fff;
      animation: cardIn 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    /* soft animated glow ring around the card */
    .card::before {
      content: "";
      position: absolute;
      inset: -8px;
      z-index: -1;
      border-radius: 42px;
      background: linear-gradient(120deg, var(--pink), var(--yellow), var(--green), var(--blue), var(--purple));
      background-size: 300% 300%;
      filter: blur(14px);
      opacity: 0.35;
      animation: bgShift 10s ease infinite;
    }

    @keyframes cardIn {
      0% { transform: translateY(40px) scale(0.9); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .title {
      font-size: 1.55rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title::first-letter { -webkit-text-fill-color: initial; }

    .score-pill {
      background: linear-gradient(135deg, #ffe27a, var(--yellow));
      color: #6b4b00;
      font-weight: 800;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 1rem;
      box-shadow: 0 5px 0 #e0a800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: pulsePill 2.4s ease-in-out infinite;
    }
    @keyframes pulsePill {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* progress dots */
    .progress {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
    }
    .dot {
      width: 26px;
      height: 10px;
      border-radius: 999px;
      background: #e6e0f5;
      transition: background 0.3s, transform 0.3s;
    }
    .dot.done { background: linear-gradient(90deg, var(--green), #7be0a8); }
    .dot.current { background: linear-gradient(90deg, var(--purple), var(--pink)); transform: scaleX(1.35); box-shadow: 0 3px 8px rgba(124,77,255,0.5); }

    .q-number {
      text-align: center;
      font-weight: 800;
      color: #fff;
      font-size: 0.92rem;
      margin: 0 auto 10px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      padding: 5px 16px;
      border-radius: 999px;
      width: fit-content;
      box-shadow: 0 5px 0 rgba(124,77,255,0.35);
    }

    .question {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
      text-wrap: balance;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      0% { transform: translateY(12px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .img-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
      animation: bob 3.5s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .img-wrap img {
      width: 168px;
      height: 168px;
      object-fit: contain;
      background: radial-gradient(circle at 50% 40%, #ffffff, #f3f0fb);
      border-radius: 28px;
      padding: 12px;
      border: 5px solid #fff;
      outline: 4px dashed #d9cff2;
      outline-offset: 2px;
      box-shadow: 0 12px 26px rgba(124,77,255,0.18);
      animation: pop 0.5s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.6) rotate(-8deg); opacity: 0; }
      70% { transform: scale(1.1) rotate(3deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .option {
      font-family: inherit;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--ink);
      background: linear-gradient(180deg, #faf8ff, #f2ecff);
      border: 3px solid #e3dbf7;
      border-radius: 20px;
      padding: 17px 10px;
      cursor: pointer;
      transition: transform 0.12s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 5px 0 #ded4f6;
      animation: optIn 0.45s ease both;
    }
    .option:nth-child(1) { animation-delay: 0.05s; }
    .option:nth-child(2) { animation-delay: 0.13s; }
    .option:nth-child(3) { animation-delay: 0.21s; }
    .option:nth-child(4) { animation-delay: 0.29s; }
    @keyframes optIn {
      0% { transform: translateY(16px) scale(0.92); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .option:hover:not(:disabled) {
      transform: translateY(-3px);
      background: linear-gradient(180deg, #fff, #efe6ff);
      border-color: var(--purple);
      box-shadow: 0 8px 0 #ded4f6;
    }
    .option:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
    .option:disabled { cursor: not-allowed; }

    .option.correct {
      background: linear-gradient(180deg, #43e08c, var(--green));
      border-color: #26b063;
      box-shadow: 0 5px 0 #26b063;
      color: #fff;
      animation: bounce 0.6s;
    }
    .option.wrong {
      background: linear-gradient(180deg, #ff7a7a, var(--red));
      border-color: #e04444;
      box-shadow: 0 5px 0 #e04444;
      color: #fff;
      animation: shake 0.45s;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-12px) scale(1.05); }
      60% { transform: translateY(-5px) scale(1.02); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    .nav {
      display: flex;
      gap: 14px;
    }
    .nav button {
      flex: 1;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 15px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: #fff;
      transition: transform 0.12s, filter 0.2s, box-shadow 0.2s;
    }
    #prevBtn { background: linear-gradient(135deg, #6fc9ff, var(--blue)); box-shadow: 0 6px 0 #2b8fcc; }
    #nextBtn { background: linear-gradient(135deg, #ff85aa, var(--pink)); box-shadow: 0 6px 0 #d63c69; }
    .nav button:hover:not(:disabled) { transform: translateY(-3px); filter: brightness(1.05); box-shadow: 0 9px 0 rgba(0,0,0,0.15); }
    .nav button:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
    #nextBtn:not(:disabled) { animation: readyPulse 1.4s ease-in-out infinite; }
    @keyframes readyPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .nav button:disabled {
      background: #d8d2e6;
      box-shadow: 0 6px 0 #c4bcd8;
      cursor: not-allowed;
      color: #fff;
      opacity: 0.75;
    }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #8a7fb0;
      min-height: 22px;
    }

    /* Emoji feedback popup */
    .emoji-pop {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 8.5rem;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.25));
    }
    .emoji-pop.show {
      animation: emojiPop 1.1s ease forwards;
    }
    @keyframes emojiPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-20deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.35) rotate(8deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1) rotate(-4deg); opacity: 1; }
      80% { transform: translate(-50%, -55%) scale(1) rotate(0); opacity: 1; }
      100% { transform: translate(-50%, -78%) scale(0.8) rotate(0); opacity: 0; }
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* Final popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(58, 46, 92, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }
    .overlay.show { display: flex; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .final {
      position: relative;
      background: linear-gradient(180deg, #ffffff, #fdf7ff);
      border-radius: 34px;
      padding: 34px 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      border: 6px solid var(--yellow);
      box-shadow: 0 22px 55px rgba(0,0,0,0.35);
      animation: popIn 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      overflow: hidden;
    }
    /* sweeping shine across the final card */
    .final::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.7), transparent);
      transform: skewX(-20deg);
      animation: shine 2.6s ease-in-out infinite;
    }
    @keyframes shine {
      0% { left: -60%; }
      55%, 100% { left: 130%; }
    }
    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .final .big-emoji {
      font-size: 5.2rem;
      animation: spinPop 1s ease, floatEmoji 3s ease-in-out 1s infinite;
      display: inline-block;
    }
    @keyframes spinPop {
      0% { transform: scale(0) rotate(-180deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .final h2 {
      background: linear-gradient(90deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.1rem;
      margin: 8px 0;
    }
    .final p {
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .final .final-score {
      color: var(--pink);
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 20px;
    }
    .play-again {
      position: relative;
      z-index: 1;
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border: none;
      border-radius: 999px;
      padding: 16px 34px;
      cursor: pointer;
      box-shadow: 0 9px 0 #5a35c4;
      animation: wiggle 1.6s ease-in-out infinite;
    }
    .play-again:hover { filter: brightness(1.08); }
    .play-again:active { transform: translateY(5px); box-shadow: 0 4px 0 #5a35c4; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg) scale(1); }
      50% { transform: rotate(2deg) scale(1.06); }
    }

    @media (max-width: 420px) {
      .options { grid-template-columns: 1fr; }
      .question { font-size: 1.2rem; }
      .title { font-size: 1.3rem; }
      .img-wrap img { width: 148px; height: 148px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>
  <div class="blob b6"></div>
  <span class="twinkle t1" aria-hidden="true">⭐</span>
  <span class="twinkle t2" aria-hidden="true">✨</span>
  <span class="twinkle t3" aria-hidden="true">⭐</span>
  <span class="twinkle t4" aria-hidden="true">✨</span>
  <span class="twinkle t5" aria-hidden="true">⭐</span>

  <canvas id="confetti"></canvas>
  <div class="emoji-pop" id="emojiPop" aria-hidden="true"></div>

  <main class="card" role="main">
    <header>
      <div class="title">🎈 Quiz Kids</div>
      <div class="score-pill">⭐ <span id="score">0</span></div>
    </header>

    <div class="progress" id="progress" aria-hidden="true"></div>

    <div class="q-number" id="qNumber">Question 1 of 5</div>
    <h1 class="question" id="question">Loading...</h1>

    <div class="img-wrap">
      <img id="qImage" src="" alt="Question picture" />
    </div>

    <div class="options" id="options"></div>

    <div class="nav">
      <button id="prevBtn" type="button">⬅ Prev</button>
      <button id="nextBtn" type="button">Next ➡</button>
    </div>

    <p class="hint" id="hint">Pick the right answer to unlock Next!</p>
  </main>

  <!-- Final popup -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="finalTitle">
    <div class="final">
      <div class="big-emoji" id="finalEmoji">🏆</div>
      <h2 id="finalTitle">You Did It!</h2>
      <p>Great job, superstar!</p>
      <div class="final-score" id="finalScore">Score: 0 / 5</div>
      <button class="play-again" id="playAgain" type="button">🔄 Play Again</button>
    </div>
  </div>

  <script>
    // ---------- Questions data ----------
    const QUESTIONS = [
      {
        question: "Which animal is this?",
        image: "/images/cat.png",
        options: ["Dog", "Cat", "Rabbit", "Bird"],
        answer: 1,
      },
      {
        question: "How many apples do you see?",
        image: "/images/apples.png",
        options: ["2", "3", "4", "5"],
        answer: 1,
      },
      {
        question: "What color is the banana?",
        image: "/images/banana.png",
        options: ["Red", "Green", "Yellow", "Blue"],
        answer: 2,
      },
      {
        question: "What shape is this?",
        image: "/images/star.png",
        options: ["Square", "Star", "Circle", "Heart"],
        answer: 1,
      },
      {
        question: "Which animal says 'Moo'?",
        image: "/images/cow.png",
        options: ["Duck", "Dog", "Cow", "Cat"],
        answer: 2,
      },
    ];

    // ---------- State ----------
    let current = 0;
    let score = 0;
    const solved = new Array(QUESTIONS.length).fill(false); // correctly answered

    // ---------- Elements ----------
    const $ = (id) => document.getElementById(id);
    const questionEl = $("question");
    const qNumberEl = $("qNumber");
    const qImageEl = $("qImage");
    const optionsEl = $("options");
    const prevBtn = $("prevBtn");
    const nextBtn = $("nextBtn");
    const scoreEl = $("score");
    const hintEl = $("hint");
    const progressEl = $("progress");
    const emojiPop = $("emojiPop");
    const overlay = $("overlay");

    // ---------- Build progress dots ----------
    QUESTIONS.forEach((_, i) => {
      const d = document.createElement("span");
      d.className = "dot";
      progressEl.appendChild(d);
    });

    function updateProgress() {
      [...progressEl.children].forEach((dot, i) => {
        dot.classList.toggle("done", solved[i]);
        dot.classList.toggle("current", i === current);
      });
    }

    // ---------- Sound (Web Audio API, no files needed) ----------
    let audioCtx;
    function beep(type) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (type === "correct") {
          playTone(523.25, 0, 0.12); // C5
          playTone(659.25, 0.12, 0.12); // E5
          playTone(783.99, 0.24, 0.2); // G5
        } else {
          playTone(196, 0, 0.18, "sawtooth"); // low buzz
          playTone(155, 0.18, 0.22, "sawtooth");
        }
      } catch (e) { /* audio not available */ }
    }
    function playTone(freq, delay, dur, wave) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = wave || "triangle";
      osc.frequency.value = freq;
      const start = audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.02);
    }

    // ---------- Emoji popup ----------
    function showEmoji(emoji) {
      emojiPop.textContent = emoji;
      emojiPop.classList.remove("show");
      void emojiPop.offsetWidth; // restart animation
      emojiPop.classList.add("show");
    }

    // ---------- Confetti ----------
    const canvas = $("confetti");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let confettiRAF = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const COLORS = ["#ff5c8a", "#ffcb2b", "#2fd07a", "#38b6ff", "#7c4dff", "#ff8a3d"];

    function launchConfetti(amount = 120) {
      for (let i = 0; i < amount; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height * 0.3,
          w: 8 + Math.random() * 8,
          h: 10 + Math.random() * 10,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          vx: (Math.random() - 0.5) * 3,
          vy: 3 + Math.random() * 4,
        });
      }
      if (!confettiRAF) confettiRAF = requestAnimationFrame(renderConfetti);
    }

    function renderConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vy += 0.05;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      confettiPieces = confettiPieces.filter((p) => p.y < canvas.height + 40);
      if (confettiPieces.length > 0) {
        confettiRAF = requestAnimationFrame(renderConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        confettiRAF = null;
      }
    }

    // ---------- Render a question ----------
    function render() {
      const q = QUESTIONS[current];
      questionEl.textContent = q.question;
      qNumberEl.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      qImageEl.src = q.image;
      qImageEl.alt = q.question;
      // restart image pop animation
      qImageEl.style.animation = "none";
      void qImageEl.offsetWidth;
      qImageEl.style.animation = "";

      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.type = "button";
        btn.textContent = opt;
        // if already solved, lock in the correct highlight
        if (solved[current]) {
          btn.disabled = true;
          if (i === q.answer) btn.classList.add("correct");
        }
        btn.addEventListener("click", () => handleAnswer(i, btn));
        optionsEl.appendChild(btn);
      });

      // nav buttons
      prevBtn.disabled = current === 0;
      nextBtn.disabled = !solved[current];
      nextBtn.textContent = current === QUESTIONS.length - 1 ? "Finish 🎉" : "Next ➡";

      hintEl.textContent = solved[current]
        ? "Nice! You can go Next 👉"
        : "Pick the right answer to unlock Next!";

      updateProgress();
    }

    // ---------- Answer handling ----------
    function handleAnswer(index, btn) {
      if (solved[current]) return; // already answered correctly, locked
      const q = QUESTIONS[current];

      if (index === q.answer) {
        // Correct!
        solved[current] = true;
        score += 1;
        scoreEl.textContent = score;
        btn.classList.add("correct");
        [...optionsEl.children].forEach((b) => (b.disabled = true));
        showEmoji("😄");
        beep("correct");
        launchConfetti(130);
        nextBtn.disabled = false;
        hintEl.textContent = "Awesome! 🎉";
        updateProgress();

        // If last question, auto-open final popup
        if (current === QUESTIONS.length - 1) {
          setTimeout(showFinal, 1200);
        }
      } else {
        // Wrong - let them try again
        btn.classList.add("wrong");
        showEmoji("😢");
        beep("wrong");
        hintEl.textContent = "Oops! Try again 💪";
        // remove wrong style after animation so they can retry
        setTimeout(() => btn.classList.remove("wrong"), 700);
      }
    }

    // ---------- Final popup ----------
    function showFinal() {
      $("finalScore").textContent = `Score: ${score} / ${QUESTIONS.length}`;
      const perfect = score === QUESTIONS.length;
      $("finalEmoji").textContent = perfect ? "🏆" : "🌟";
      $("finalTitle").textContent = perfect ? "Perfect Score!" : "Well Done!";
      overlay.classList.add("show");
      launchConfetti(200);
      beep("correct");
    }

    // ---------- Navigation ----------
    prevBtn.addEventListener("click", () => {
      if (current > 0) {
        current -= 1;
        render();
      }
    });
    nextBtn.addEventListener("click", () => {
      if (!solved[current]) return;
      if (current < QUESTIONS.length - 1) {
        current += 1;
        render();
      } else {
        showFinal();
      }
    });

    // ---------- Play again ----------
    $("playAgain").addEventListener("click", () => {
      current = 0;
      score = 0;
      scoreEl.textContent = "0";
      solved.fill(false);
      overlay.classList.remove("show");
      render();
    });

    // ---------- Start ----------
    render();
  </script>
</body>
</html>
